
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#244c3e">
<title>پلنر شخصی رضا</title>
<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  font-family: Tahoma, sans-serif;
  background: #f3efe3;
  color: #263c32;
}
header {
  background: #244c3e;
  color: #fff8e9;
  padding: 25px 18px;
  border-radius: 0 0 22px 22px;
}
header h1 {
  margin: 0 0 10px;
  font-size: 23px;
}
header p {
  margin: 0;
  color: #e3dfcc;
}
main {
  padding: 18px;
}
.card {
  background: #fffdf6;
  border: 1px solid #e4dfd0;
  border-radius: 16px;
  padding: 18px;
  margin-bottom: 15px;
}
h2 {
  font-size: 17px;
  margin-top: 0;
}
.placeholder {
  color: #777b70;
  font-size: 14px;
  line-height: 2;
}
</style>
</head>
<body>

<header>
  <h1>پلنر شخصی من</h1>
  <p>برنامه‌ریزی، هدف‌گذاری و پیشرفت روزانه</p>
</header>

<main>
  <section class="card">
    <h2>داشبورد من</h2>
    <p class="placeholder">
      به پلنر شخصی خودت خوش آمدی.
    </p>
  </section>

  <section class="card">
    <h2>برنامه امروز</h2>
    <p class="placeholder">
      کارهای روزانه در این قسمت نمایش داده می‌شوند.
    </p>
  </section>

  <section class="card">
    <h2>اهداف من</h2>
    <p class="placeholder">
      اهداف شخصی و مالی تو اینجا قرار می‌گیرند.
    </p>
  </section>
</main>

</body>
</html>
